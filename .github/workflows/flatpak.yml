name: Flatpak

# Builds the Flatpak as Flathub does (offline, from flatpak/cz.stakovi.plume.yml), after generating the npm and
# cargo source lists. The bundle and the two lists are kept as artifacts: the lists go into the Flathub repository.
on:
  pull_request:
    paths: ['flatpak/**', 'package-lock.json', 'src-tauri/Cargo.lock', 'scripts/flatpak-sources.sh', '.github/workflows/flatpak.yml']
  workflow_dispatch:

jobs:
  flatpak:
    # aarch64 too: Flathub builds both, and an Apple Silicon VM runs only arm64 Linux.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: npm and cargo source lists
        run: scripts/flatpak-sources.sh

      - if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-sources
          path: flatpak/*-sources.json

      # The screenshot URLs point to main, the video to the site: checked here at the commit being built, where they
      # already exist.
      - name: Flathub's checks of the AppStream metadata
        if: matrix.arch == 'x86_64'
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          flatpak install -y --noninteractive flathub org.flatpak.Builder
          sed -e "s|/stakovicz/plume/main/|/stakovicz/plume/$SHA/|" \
            -e "s|https://stakovicz.github.io/plume/img/|https://raw.githubusercontent.com/stakovicz/plume/$SHA/site/img/|" \
            flatpak/cz.stakovi.plume.metainfo.xml > "$RUNNER_TEMP/cz.stakovi.plume.metainfo.xml"
          flatpak run --command=flatpak-builder-lint --filesystem="$RUNNER_TEMP" org.flatpak.Builder appstream "$RUNNER_TEMP/cz.stakovi.plume.metainfo.xml"

      # ponytail: since 2026-11-21 the image's preinstalled SDK fails to update in place ("Invalid cross-device link":
      # overlayfs can't rename a directory from a lower layer). Copying the installations into the container's own
      # layer works around it; drop this step once the image is fixed.
      - name: Move the image's Flatpak installations into the container layer
        run: |
          for d in /var/lib/flatpak "$HOME/.local/share/flatpak"; do
            [ -d "$d" ] || continue
            cp -a "$d" "$d.copy" && rm -rf "$d" && mv "$d.copy" "$d"
          done

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flatpak/cz.stakovi.plume.yml
          bundle: plume.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('package-lock.json', 'src-tauri/Cargo.lock') }}
