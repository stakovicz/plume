name: Release

# A pushed tag (v0.2.0, …) builds every platform and attaches the bundles to that tag's release.
# Run by hand on a branch: builds only, bundles kept as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm test

      - name: Release notes (the version's CHANGELOG section)
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<EOF'
            awk -v h="## ${GITHUB_REF_NAME#v} " 'index($0, h) == 1 { p = 1; next } /^## / { p = 0 } p' CHANGELOG.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Plume ${{ github.ref_name }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ---

            macOS : Apple Silicon (aarch64) ou Intel (x64). Application non signée : au premier lancement,
            clic droit sur Plume.app → Ouvrir (ou `xattr -dr com.apple.quarantine /Applications/Plume.app`).
            Linux : .AppImage, .deb ou .rpm.
            Windows : programme d'installation .exe ou .msi. Non signé : si Windows SmartScreen bloque, cliquez sur
            Informations complémentaires, puis Exécuter quand même.

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: plume-${{ matrix.target }}
          path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), fromJSON('"\n"')) }}

  # Package managers follow each release: the Homebrew cask in stakovicz/homebrew-tap (TAP_TOKEN: a token
  # with write access to that repository) and plume-editor-bin on the AUR (AUR_SSH_PRIVATE_KEY: the key
  # registered on the AUR account).
  homebrew:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: stakovicz/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
      - name: Version and checksums of the new .dmg and .AppImage files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --pattern '*.AppImage' --dir "$RUNNER_TEMP"
          sum() { sha256sum "$RUNNER_TEMP/$1" | cut -d' ' -f1; }
          sed -i -E -e "s/^  version \".*\"/  version \"$v\"/" \
            -e "s/(arm: *)\"[0-9a-f]*\"/\1\"$(sum Plume_${v}_aarch64.dmg)\"/" \
            -e "s/(intel: *)\"[0-9a-f]*\"/\1\"$(sum Plume_${v}_x64.dmg)\"/" \
            -e "s/(x86_64_linux: *)\"[0-9a-f]*\"/\1\"$(sum Plume_${v}_amd64.AppImage)\"/" Casks/plume-editor.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "plume-editor $v"
          git push

  aur:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - if: env.AUR_KEY != '' # skipped until the AUR account exists
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: plume-editor-bin
          pkgbuild: packaging/aur/PKGBUILD
          updpkgsums: true
          commit_username: stakovicz
          commit_email: stakovicz@users.noreply.github.com
          commit_message: plume-editor-bin ${{ github.ref_name }}
          ssh_private_key: ${{ env.AUR_KEY }}

  # winget: Komac adds the version to Stakovicz.Plume and opens the pull request to microsoft/winget-pkgs
  # (WINGET_TOKEN: a classic token with the public_repo scope). The package's first version is submitted by hand.
  winget:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - if: env.WINGET_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://github.com/russellbanks/Komac/releases/download/v2.17.1/komac-2.17.1-x86_64-unknown-linux-gnu.tar.gz | tar xz komac
          urls=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].url | select(test("\\.(exe|msi)$"))')
          ./komac update Stakovicz.Plume --version "${GITHUB_REF_NAME#v}" --urls $urls --submit --token "$WINGET_TOKEN"

  # The Snap Store (SNAPCRAFT_STORE_CREDENTIALS: `snapcraft export-login`), from snap/snapcraft.yaml. Run by hand
  # on a branch: the snap is built and kept as a workflow artifact.
  snap:
    needs: build
    runs-on: ubuntu-24.04
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo snap install snapcraft --classic
      - run: sudo snapcraft pack --destructive-mode # the runner is Ubuntu 24.04, like the snap's core24 base
      - if: startsWith(github.ref, 'refs/tags/') && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: snapcraft upload --release=stable plume-editor_*.snap
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: plume-editor-snap
          path: plume-editor_*.snap

  # Once the bundles are attached, rebuild the site so its download buttons point to this release. Triggered
  # explicitly: a release created with GITHUB_TOKEN doesn't fire pages.yml's `release` event.
  site:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
