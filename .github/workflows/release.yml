name: Release

# A pushed tag (v0.2.0, …) builds every platform and attaches the bundles to that tag's release.
# Run by hand on a branch: builds only, bundles kept as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm test

      - name: Release notes (the version's CHANGELOG section)
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<EOF'
            awk -v h="## ${GITHUB_REF_NAME#v} " 'index($0, h) == 1 { p = 1; next } /^## / { p = 0 } p' CHANGELOG.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Plume ${{ github.ref_name }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ---

            macOS : Apple Silicon (aarch64) ou Intel (x64). Application non signée : au premier lancement,
            clic droit sur Plume.app → Ouvrir (ou `xattr -dr com.apple.quarantine /Applications/Plume.app`).
            Linux : .AppImage, .deb ou .rpm.

      - uses: actions/upload-artifact@v6
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: plume-${{ matrix.target }}
          path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), fromJSON('"\n"')) }}

  # Once the bundles are attached, rebuild the site so its download buttons point to this release. Triggered
  # explicitly: a release created with GITHUB_TOKEN doesn't fire pages.yml's `release` event.
  site:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
