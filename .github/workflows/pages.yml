name: Site

# The presentation site, documentation and web editor on GitHub Pages (https://stakovicz.github.io/plume/).
# Built from main (whose pull requests passed CI), and again for each release so its download links are current:
# release.yml runs this workflow once the bundles are attached (`release` covers releases published by hand).
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }} # signs the APT and RPM repositories
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # latest release, for the download buttons

      - name: APT and RPM repositories (latest release)
        if: env.REPO_GPG_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c
          scripts/linux-repos.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
