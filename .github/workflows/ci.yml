name: CI

# Every pull request and every push to main: the same checks as `npm version` (tests, types, style rules).
# The editor is all TypeScript, so no Rust or Tauri build here; release.yml builds the app.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# a new push to a pull request cancels the run still going on its previous commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # one job per check, run in parallel, each shown (and required) on its own in a pull request
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: tests, run: npm test }
          - { name: types, run: npm run check }
          - { name: lint, run: npm run lint }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: ${{ matrix.run }}
